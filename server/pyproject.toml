[project]
name = "hanoi-cube-server"
version = "0.1.0"
description = "Hanoi Cube サーバー(FastAPI・状態機械・ゲームコア・CVワーカー)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "websockets>=12",
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "pupil-apriltags>=1.0.4.post11",
    "firebase-admin>=6.5",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",
]

[tool.mypy]
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
# 型スタブが提供されていない外部CVライブラリ・Firebase Admin SDK
module = ["pupil_apriltags.*", "cv2.*", "firebase_admin.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
