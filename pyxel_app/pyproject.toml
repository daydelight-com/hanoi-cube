[project]
name = "hanoi-cube-pyxel"
version = "0.1.0"
description = "Hanoi Cube Pyxel Cube 版(ブラウザ単体でプレイ)"
requires-python = ">=3.12"
dependencies = [
    # app.core(server/app/core)が依存する
    "pydantic>=2.7",
    # Pyxel cube ブランチ。PyPI 版(2.9.x)には pyxel.cube が無いため GitHub Release の wheel を使う。
    # Windows 用 wheel は未作成(仕様書 §11 #8)。Windows ではこの行を手動で差し替える。
    "pyxel==3.0.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
pyxel = { url = "https://github.com/daydelight-com/hanoi-cube/releases/download/pyxel-cube-runtime-2026-08-23/pyxel-3.0.0-cp311-abi3-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
]

[tool.ruff]
line-length = 100
src = [".", "tests"]
extend-exclude = ["runtime", "_core"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]  # server/app/core(sys.path 経由で import)

[tool.mypy]
strict = true
files = [
    "main.py",
    "board_state.py",
    "sfx.py",
    "session.py",
    "i18n.py",
    "storage.py",
    "scene",
    "input",
    "screens",
    "tests",
]
mypy_path = "../server"
explicit_package_bases = true
exclude = ["runtime", "_core"]

[[tool.mypy.overrides]]
# pyxel は wheel 同梱の .pyi で型付けされるが、wheel を入れられない環境(Windows など)では Any として扱う
module = ["pyxel", "pyxel.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
